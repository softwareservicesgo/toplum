<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders</title>

    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #080c12;
        --surface: #0d1420;
        --border: rgba(255, 255, 255, 0.07);
        --accent: #00e5ff;
        --green: #00e676;
        --red: #ff1744;
        --text: #e2e8f0;
        --muted: #4a5568;
        --card: #111827;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Syne", sans-serif;
        padding: 2rem;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 1rem;
      }

      .badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        padding: 0.3rem 0.7rem;
        border-radius: 5px;
      }

      .badge-on {
        background: rgba(0, 230, 118, 0.12);
        color: var(--green);
      }

      .badge-off {
        background: rgba(255, 23, 68, 0.12);
        color: var(--red);
      }

      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }

      input {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: white;
      }

      .filter-btn {
        padding: 6px 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        border-radius: 6px;
      }

      .filter-btn.active {
        color: var(--accent);
        border-color: var(--accent);
      }

      .panel {
        background: var(--surface);
        padding: 15px;
        border-radius: 10px;
      }

      .order-card {
        display: flex;
        justify-content: space-between;
        padding: 12px;
        margin-bottom: 8px;
        background: var(--card);
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      .status {
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
      }

      .s-PENDING {
        color: orange;
      }

      .s-APPROVED {
        color: var(--green);
      }

      .s-COMPLETED {
        color: var(--accent);
      }

      .s-CANCELLED {
        color: var(--red);
      }

      .empty {
        text-align: center;
        padding: 30px;
        color: var(--muted);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h2>My Orders</h2>
        <div id="statusBadge" class="badge badge-on">LIVE</div>
      </header>

      <div class="toolbar">
        <input id="searchInput" placeholder="Search..." oninput="onSearch()" />

        <button
          class="filter-btn active"
          data-status=""
          onclick="setStatus(this)"
        >
          All
        </button>
        <button
          class="filter-btn"
          data-status="PENDING"
          onclick="setStatus(this)"
        >
          Pending
        </button>
        <button
          class="filter-btn"
          data-status="APPROVED"
          onclick="setStatus(this)"
        >
          Approved
        </button>
        <button
          class="filter-btn"
          data-status="COMPLETED"
          onclick="setStatus(this)"
        >
          Completed
        </button>
        <button
          class="filter-btn"
          data-status="CANCELLED"
          onclick="setStatus(this)"
        >
          Cancelled
        </button>
      </div>

      <div class="panel">
        <div id="ordersList">
          <div class="empty">Loading...</div>
        </div>
      </div>
    </div>

    <script>
      const LIMIT = 5;

      let state = {
        offset: 0,
        limit: LIMIT,
        status: "",
        search: "",
      };

      let ws = null;
      let timer = null;

      function connect() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const url = `${proto}//${location.host}/api/v1/order/ws/orderClient`;

        ws = new WebSocket(url);

        ws.onopen = () => {
          setConnected(true);
          sendFilter();
        };

        ws.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            renderOrders(data.orders || []);
          } catch (err) {}
        };

        ws.onerror = () => setConnected(false);

        ws.onclose = () => {
          setConnected(false);
          setTimeout(connect, 3000);
        };
      }

      function setConnected(v) {
        const el = document.getElementById("statusBadge");
        el.textContent = v ? "LIVE" : "OFFLINE";
        el.className = "badge " + (v ? "badge-on" : "badge-off");
      }

      function sendFilter() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        ws.send(
          JSON.stringify({
            limit: String(state.limit),
            offset: String(state.offset),
            status: state.status,
            search: state.search,
          }),
        );
      }

      function setStatus(btn) {
        document
          .querySelectorAll(".filter-btn")
          .forEach((b) => b.classList.remove("active"));

        btn.classList.add("active");

        state.status = btn.dataset.status;
        state.offset = 0;

        sendFilter();
      }

      function onSearch() {
        clearTimeout(timer);

        timer = setTimeout(() => {
          state.search = document.getElementById("searchInput").value.trim();
          state.offset = 0;
          sendFilter();
        }, 300);
      }

      function renderOrders(orders) {
        const el = document.getElementById("ordersList");

        if (!orders.length) {
          el.innerHTML = `<div class="empty">No orders</div>`;
          return;
        }

        el.innerHTML = orders
          .map(
            (o) => `
          <div class="order-card">
            <div>
              <div><b>#${o.id}</b></div>
              <div style="font-size:12px;color:#888">
                ${o.businesses_name || "—"}
              </div>
            </div>

            <div>
              <div>${Number(o.general_bill || 0).toFixed(2)} TMT</div>
              <div class="status s-${o.status}">
                ${o.status}
              </div>
            </div>
          </div>
        `,
          )
          .join("");
      }

      connect();
    </script>
  </body>
</html>
