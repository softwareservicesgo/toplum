<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Business Orders</title>

    <style>
      body {
        background: #0b1220;
        color: white;
        font-family: Arial;
        padding: 20px;
      }

      .panel {
        background: #111827;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 10px;
      }

      .btn {
        padding: 6px 10px;
        border: 1px solid #333;
        background: transparent;
        color: white;
        cursor: pointer;
        margin-right: 5px;
      }

      .btn.active {
        border-color: #00e5ff;
        color: #00e5ff;
      }
    </style>
  </head>

  <body>
    <h2>Business Orders</h2>

    <div class="panel">
      <button class="btn active" data-status="" onclick="setStatus(this)">
        ALL
      </button>
      <button class="btn" data-status="PENDING" onclick="setStatus(this)">
        PENDING
      </button>
      <button class="btn" data-status="APPROVED" onclick="setStatus(this)">
        APPROVED
      </button>
      <button class="btn" data-status="COMPLETED" onclick="setStatus(this)">
        COMPLETED
      </button>
      <button class="btn" data-status="CANCELLED" onclick="setStatus(this)">
        CANCELLED
      </button>
    </div>

    <div class="panel" id="list">Loading...</div>

    <script>
      const businessesId = new URLSearchParams(location.search).get(
        "businessesId",
      );

      let ws;

      let state = {
        offset: 0,
        limit: 5,
        status: "",
        search: "",
      };

      function connect() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const url = `${proto}//${location.host}/api/v1/order/ws/orderBusinesses/${businessesId}`;

        console.log("WS URL:", url);

        ws = new WebSocket(url);

        ws.onopen = () => {
          console.log("WS OPEN");

          setTimeout(() => {
            send();
          }, 200);
        };

        ws.onmessage = (e) => {
          console.log("RAW:", e.data);

          const data = JSON.parse(e.data);

          render(data.orders || []);
        };

        ws.onerror = (e) => console.log("WS ERROR", e);

        ws.onclose = () => {
          console.log("WS CLOSED");
          setTimeout(connect, 2000);
        };
      }

      function send() {
        if (!ws || ws.readyState !== 1) return;

        ws.send(
          JSON.stringify({
            limit: String(state.limit),
            offset: String(state.offset),
            status: state.status,
            search: state.search,
          }),
        );
      }

      function setStatus(btn) {
        document
          .querySelectorAll(".btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");

        state.status = btn.dataset.status;
        state.offset = 0;

        send();
      }

      function render(orders) {
        const el = document.getElementById("list");

        if (!orders.length) {
          el.innerHTML = "No orders";
          return;
        }

        el.innerHTML = orders
          .map(
            (o) => `
    <div>
      <b>#${o.id}</b>
      ${o.client?.full_name || ""}
      ${o.general_bill} TMT
      <span>${o.status}</span>
    </div>
  `,
          )
          .join("");
      }

      connect();
    </script>
  </body>
</html>
